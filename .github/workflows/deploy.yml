name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Montar a pasta publicada (CSS e JS minificados)
        run: |
          mkdir -p _site
          cp -r index.html obrigado.html favicon.png CNAME assets _site/
          npx --yes esbuild@0.24.0 assets/css/style.css --minify --outfile=_site/assets/css/style.css
          npx --yes esbuild@0.24.0 assets/js/main.js --minify --outdir=_site/assets/js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
